name: Integración continua
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexo-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validar Docker Compose
        run: |
          node scripts/setup.mjs --env-only > /dev/null
          docker compose config --quiet
      - name: Construir las imágenes
        run: docker compose build
      - name: Arrancar el entorno completo
        run: docker compose up -d --wait --wait-timeout 180
      - name: Comprobar el panel, el proxy y las APIs
        run: |
          curl --fail --silent --show-error http://localhost:5173/ --output /dev/null
          curl --fail --silent --show-error http://localhost:5173/docs-json --output /dev/null
          curl --fail --silent --show-error http://localhost:3001/ready --output /dev/null
          curl --fail --silent --show-error http://localhost:3002/ready --output /dev/null
          curl --fail --silent --show-error http://localhost:3003/ready --output /dev/null
      - name: Mostrar logs si falla el entorno
        if: failure()
        run: |
          docker compose ps --all
          docker compose ps --all --quiet web | xargs --no-run-if-empty docker inspect --format '{{json .State.Health}}'
          docker compose logs --no-color --tail=80
      - name: Detener el entorno efímero
        if: always()
        run: docker compose down --volumes --remove-orphans
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
      moto:
        image: motoserver/moto:5.2.2
        ports: ['5000:5000']
    env:
      NODE_ENV: test
      JWT_SECRET: local-ci-only-secret-longer-than-forty-eight-characters-2026
      SEED_PASSWORD: Nexo-Integration-CI-Only-2026!
      OPERATIONS_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/nexo_operations
      DOCUMENTS_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/nexo_documents
      NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/nexo_notifications
      WEB_ORIGIN: http://localhost:5173
      AWS_ENDPOINT_URL: http://localhost:5000
      S3_PUBLIC_ENDPOINT: http://localhost:5000
      AWS_REGION: us-east-1
      AWS_SECRET_ID: nexo/local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:server
      - name: Crear bases aisladas y esperar al emulador
        run: node scripts/ci-infra.mjs
      - run: npm run infra:bootstrap
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.13.5'
      - working-directory: infra/terraform
        run: terraform fmt -check && terraform init -backend=false && terraform validate
