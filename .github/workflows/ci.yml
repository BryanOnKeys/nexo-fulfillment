name: Integración continua
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexo-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validar Docker Compose
        run: |
          node scripts/setup.mjs --env-only > /dev/null
          docker compose config --quiet
      - name: Construir las imágenes
        run: docker compose build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
      moto:
        image: motoserver/moto:5.2.2
        ports: ['5000:5000']
    env:
      NODE_ENV: test
      JWT_SECRET: local-ci-only-secret-longer-than-forty-eight-characters-2026
      SEED_PASSWORD: Nexo-Integration-CI-Only-2026!
      OPERATIONS_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/nexo_operations
      DOCUMENTS_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/nexo_documents
      NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/nexo_notifications
      WEB_ORIGIN: http://localhost:5173
      AWS_ENDPOINT_URL: http://localhost:5000
      S3_PUBLIC_ENDPOINT: http://localhost:5000
      AWS_REGION: us-east-1
      AWS_SECRET_ID: nexo/local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:server
      - name: Crear bases aisladas y esperar al emulador
        run: node scripts/ci-infra.mjs
      - run: npm run infra:bootstrap
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - working-directory: infra/terraform
        run: terraform fmt -check && terraform init -backend=false && terraform validate
