upstream operations { server operations:3001; }
upstream documents { server documents:3002; }
upstream notifications { server notifications:3003; }
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 location /api/v1/documents { proxy_pass http://documents; proxy_set_header Host $host; }
 location /api/v1/notifications { proxy_pass http://notifications; proxy_set_header Host $host; }
 location /api/ { proxy_pass http://operations; proxy_set_header Host $host; }
 location /docs { proxy_pass http://operations; proxy_set_header Host $host; }
 location /socket.io/ {
   proxy_pass http://notifications;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
   proxy_set_header Host $host;
   proxy_read_timeout 70s;
 }
 location /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}
